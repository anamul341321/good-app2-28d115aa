apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword
def isLiteBuild = System.getenv('ANDROID_BUILD_MODE') == 'lite'
// 'calls' = separate lightweight GoodApp Call APK (installs beside Good-App).
def isCallsBuild = System.getenv('ANDROID_BUILD_MODE') == 'calls'
// 'store' = the Good-App binary uploaded to Google Play (no external APK links, no crypto payout UI).
def isStoreBuild = System.getenv('ANDROID_BUILD_MODE') == 'store'

android {
    namespace = "com.anamul.goodapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Store identity: the package Google Play and Firebase know this app by.
        // The Java namespace above stays com.anamul.goodapp (code package only),
        // so existing Java sources keep their folder layout. This identity can never
        // be changed after the app is published on Google Play.
        applicationId isCallsBuild ? "com.goodapp.calls" : "com.goodanamul.goodapp"
        manifestPlaceholders = [appLabel: isCallsBuild ? "GoodApp Call" : "Good-App"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 37
        versionName "1.37"
        buildConfigField "boolean", "LITE_BUILD", isLiteBuild.toString()
        buildConfigField "boolean", "CALLS_BUILD", isCallsBuild.toString()
        buildConfigField "boolean", "STORE_BUILD", isStoreBuild.toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // Play Protect যেন "harmful app" না বলে — v1/v2/v3 সব স্কিমেই সাইন হবে
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    // Store builds declare no ads and therefore must not bundle an ad SDK.
    if (!isStoreBuild) {
        implementation 'com.unity3d.ads:unity-ads:4.12.3'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

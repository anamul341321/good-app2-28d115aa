name: Build Android APK/AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "apk-release"
        type: choice
        options:
          - apk-release
          - aab-release
          - apk-debug


concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor
        run: bun run cap:sync

      - name: Read Android version
        id: android_version
        shell: bash
        run: |
          VERSION_NAME=$(awk -F'"' '/versionName/{print $2; exit}' android/app/build.gradle)
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]*\([0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prefetch Gradle distribution (with retries)
        run: |
          cd android
          for i in 1 2 3 4 5; do
            if ./gradlew --no-daemon -version; then exit 0; fi
            echo "Gradle download failed (attempt $i) - retrying in 20s"
            sleep 20
          done
          echo "::error::Could not download Gradle distribution"
          exit 1

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'apk-debug'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'apk-release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="${{ github.workspace }}/android/app/my-release-key.jks"
          # The keystore committed in the repository is the single source of
          # truth, so every build is signed with the exact same certificate.
          if [ -s "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" ]; then
            tr -d '\n' < "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" | base64 --decode > "$KS"
            export ANDROID_KEYSTORE_PASSWORD="goodapp2026"
            export ANDROID_KEY_ALIAS="goodapp"
            export ANDROID_KEY_PASSWORD="goodapp2026"
            echo "Using permanent keystore from repository."
          elif [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "Using keystore from repository secrets."
          else
            echo "::error::No signing key found. A temporary key would change the app signature and make Android/Play Protect warn users about a harmful or unverified app."
            exit 1
          fi
          if [ ! -s "$KS" ]; then
            echo "::error::Keystore is empty"
            exit 1
          fi
          keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          export ANDROID_KEYSTORE_PATH="$KS"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          cd android
          ./gradlew --no-daemon \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            assembleRelease

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'apk-release'
        run: |
          mkdir -p android-release
          cp android/app/build/outputs/apk/release/app-release.apk android-release/Good-App-v${{ steps.android_version.outputs.name }}.apk
          CERT_SHA256=$(keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':')
          test -n "$CERT_SHA256"
          printf '{"versionName":"%s","versionCode":%s,"applicationId":"com.anamul.goodapp","signingCertSha256":"%s","commit":"%s"}\n' \
            '${{ steps.android_version.outputs.name }}' \
            '${{ steps.android_version.outputs.code }}' \
            "$CERT_SHA256" \
            '${{ github.sha }}' > android-release/release-metadata.json

      - name: Publish Release APK artifact
        if: github.event.inputs.build_type == 'apk-release'
        uses: actions/upload-artifact@v4
        with:
          name: Good-App-v${{ steps.android_version.outputs.name }}-release-apk
          path: android-release/

      - name: Build Release AAB
        if: github.event.inputs.build_type == 'aab-release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="${{ github.workspace }}/android/app/my-release-key.jks"
          # The keystore committed in the repository is the single source of
          # truth, so every build is signed with the exact same certificate.
          if [ -s "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" ]; then
            tr -d '\n' < "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" | base64 --decode > "$KS"
            export ANDROID_KEYSTORE_PASSWORD="goodapp2026"
            export ANDROID_KEY_ALIAS="goodapp"
            export ANDROID_KEY_PASSWORD="goodapp2026"
            echo "Using permanent keystore from repository."
          elif [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "Using keystore from repository secrets."
          else
            echo "::error::No signing key found. A temporary key would change the app signature and make Android/Play Protect warn users about a harmful or unverified app."
            exit 1
          fi
          if [ ! -s "$KS" ]; then
            echo "::error::Keystore is empty"
            exit 1
          fi
          keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          export ANDROID_KEYSTORE_PATH="$KS"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          cd android
          ./gradlew --no-daemon \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            bundleRelease

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'apk-debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        if: github.event.inputs.build_type == 'aab-release'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload generated signing key
        if: always() && hashFiles('signing-key/my-release-key.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-KEEP-SAFE
          path: signing-key/

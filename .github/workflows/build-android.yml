name: Build Android APK/AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk-debug'
        type: choice
        options:
          - apk-debug
          - apk-release
          - aab-release

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor
        run: bun run cap:sync

      - name: Prefetch Gradle distribution (with retries)
        run: |
          cd android
          for i in 1 2 3 4 5; do
            if ./gradlew --no-daemon -version; then exit 0; fi
            echo "Gradle download failed (attempt $i) - retrying in 20s"
            sleep 20
          done
          echo "::error::Could not download Gradle distribution"
          exit 1

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'apk-debug'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'apk-release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="${{ github.workspace }}/android/app/my-release-key.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "Using keystore from repository secrets."
          elif [ -s "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" ]; then
            tr -d '\n' < "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" | base64 --decode > "$KS"
            ANDROID_KEYSTORE_PASSWORD="goodapp2026"
            ANDROID_KEY_ALIAS="goodapp"
            ANDROID_KEY_PASSWORD="goodapp2026"
            echo "Using permanent keystore committed in the repository."
          else
            echo "::warning::No signing secrets found - generating a new keystore automatically."
            ANDROID_KEYSTORE_PASSWORD="goodapp2026"
            ANDROID_KEY_ALIAS="goodapp"
            ANDROID_KEY_PASSWORD="goodapp2026"
            keytool -genkeypair -v \
              -keystore "$KS" -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=Good-App, OU=Mobile, O=Good-App, L=Dhaka, S=Dhaka, C=BD"
            mkdir -p "${{ github.workspace }}/signing-key"
            cp "$KS" "${{ github.workspace }}/signing-key/my-release-key.jks"
            base64 -w0 "$KS" > "${{ github.workspace }}/signing-key/keystore-base64.txt"
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } > "${{ github.workspace }}/signing-key/README.txt"
          fi
          if [ ! -s "$KS" ]; then
            echo "::error::Keystore is empty"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$KS"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'apk-release'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build Release AAB
        if: github.event.inputs.build_type == 'aab-release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="${{ github.workspace }}/android/app/my-release-key.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "Using keystore from repository secrets."
          elif [ -s "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" ]; then
            tr -d '\n' < "${{ github.workspace }}/android/keystore/goodapp-release.keystore.b64" | base64 --decode > "$KS"
            ANDROID_KEYSTORE_PASSWORD="goodapp2026"
            ANDROID_KEY_ALIAS="goodapp"
            ANDROID_KEY_PASSWORD="goodapp2026"
            echo "Using permanent keystore committed in the repository."
          else
            echo "::warning::No signing secrets found - generating a new keystore automatically."
            ANDROID_KEYSTORE_PASSWORD="goodapp2026"
            ANDROID_KEY_ALIAS="goodapp"
            ANDROID_KEY_PASSWORD="goodapp2026"
            keytool -genkeypair -v \
              -keystore "$KS" -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=Good-App, OU=Mobile, O=Good-App, L=Dhaka, S=Dhaka, C=BD"
            mkdir -p "${{ github.workspace }}/signing-key"
            cp "$KS" "${{ github.workspace }}/signing-key/my-release-key.jks"
            base64 -w0 "$KS" > "${{ github.workspace }}/signing-key/keystore-base64.txt"
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } > "${{ github.workspace }}/signing-key/README.txt"
          fi
          if [ ! -s "$KS" ]; then
            echo "::error::Keystore is empty"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$KS"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'apk-debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        if: github.event.inputs.build_type == 'aab-release'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload generated signing key
        if: always() && hashFiles('signing-key/my-release-key.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-KEEP-SAFE
          path: signing-key/
